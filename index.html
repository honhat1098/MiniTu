<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conflict Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#6366f1', // Indigo 500
                light: '#a855f7',   // Purple 500
                dark: '#312e81',    // Indigo 900
                darker: '#0f172a',  // Slate 900
                accent: '#06b6d4',  // Cyan 500 (Primary Action)
                secondary: '#ec4899', // Pink 500 (Secondary Action)
                yellow: '#facc15',  // Yellow 400
                red: '#f43f5e',     // Rose 500
                glass: 'rgba(255, 255, 255, 0.1)'
              }
            },
            fontFamily: {
              sans: ['"Be Vietnam Pro"', 'sans-serif'], // Font hỗ trợ tiếng Việt tốt hơn
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pop': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards', // Bouncy pop effect
              'bounce-gentle': 'bounceGentle 2s infinite',
              'spin-slow': 'spin 10s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5) translateY(20px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              bounceGentle: {
                '0%, 100%': { transform: 'translateY(-5%)' },
                '50%': { transform: 'translateY(0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: #0f172a;
        cursor: default;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      #root {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* --- CLICK RIPPLE EFFECT --- */
      .click-ripple {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(6, 182, 212, 0.6); /* Cyan Ripple */
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: rippleEffect 0.5s ease-out forwards;
        z-index: 9999;
      }

      @keyframes rippleEffect {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 
        100% { transform: translate(-50%, -50%) scale(20); opacity: 0; }
      }

      /* --- CONFETTI EFFECT --- */
      .confetti-piece {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #facc15;
        top: -20px;
        opacity: 0;
        z-index: 50;
      }
      .confetti-piece:nth-child(odd) { background: #06b6d4; }
      .confetti-piece:nth-child(even) { background: #ec4899; }
      .confetti-piece:nth-child(3n) { background: #facc15; }
      .confetti-piece:nth-child(4n) { background: #8b5cf6; }
      
      @keyframes fall {
        0% { opacity: 1; top: -10%; transform: translateX(0) rotate(0deg); }
        100% { opacity: 0; top: 110%; transform: translateX(100px) rotate(720deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.263.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="text-white h-screen overflow-hidden font-sans">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
